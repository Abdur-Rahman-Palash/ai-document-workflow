[project]
name = "ai-document-workflow-doc-engine"
version = "0.1.0"
description = "Python FastAPI document engine for AI document workflow automation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.23.0",
  "python-docx>=0.8.11",
  "PyMuPDF>=1.22.5",
  "pdfplumber>=0.9.0",
  "pytesseract>=0.3.11",
  "python-multipart>=0.0.6",
  "pydantic>=2.8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
